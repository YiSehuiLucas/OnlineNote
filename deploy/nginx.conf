# OnlineNote nginx 站点配置
# 用法：复制到 /etc/nginx/conf.d/onlinenote.conf，修改 server_name 后执行 nginx -s reload
server {
    listen 80;
    server_name note.example.com;

    # 前端静态资源（零构建，直接托管 web/ 目录）
    root /opt/onlinenote/web;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # API 反向代理到 Go 服务
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;          # 大笔记保存上限
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/markdown;
}
